[project]
name = "kgbench"
version = "0.1.0"
description = "Independent, reproducible knowledge graph evaluation bench for graph-rag (ADR-0011)."
requires-python = ">=3.12"
dependencies = ["graph-rag-demo", "pydantic>=2", "pyyaml"]

[project.scripts]
kgbench = "kgbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kgbench"]

[tool.uv.sources]
graph-rag-demo = { workspace = true }
