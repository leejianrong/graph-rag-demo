name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Cheap gate: lint + format check (no services) -----------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (frozen)
        run: uv sync --frozen --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      # A baseline config (pyproject.toml [tool.mypy]); a type error fails the required `lint` job.
      - name: Type check (mypy)
        run: uv run mypy

  # --- Cheap gate: landing-page check (dev-playbook #15) --------------------
  # site/index.html is a hand-authored, self-contained page published to GitHub
  # Pages on merge (pages.yml). There is no docs BUILD to fail, so this is the
  # PR-time safety net: the page parses and every in-page anchor resolves, caught
  # here rather than on the live site. Stdlib only — no uv sync, no deps.
  landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check site/index.html (parses + anchors resolve)
        run: python3 scripts/check_landing_page.py

  # --- Cheap gate: the web UI (ui/, GRA-46) ---------------------------------
  # Type-check and build the Vite + Svelte app. `npm run check` and `build` regenerate the API
  # client from docs/openapi.json first; the fast suite fails if that file drifts from the app.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # --- Browser gate: sign in, ingest and query through the built UI (GRA-53) ---
  # Playwright drives chromium against `graph-rag-offline` (in-memory, no Docker, model or LLM) with
  # auth on, serving ui/dist. The key is made at run time in a temp file and never printed.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (frozen)
        run: uv sync --frozen --extra dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build the UI
        working-directory: ui
        run: npm run build
      - name: Playwright version
        id: pw
        working-directory: ui
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install chromium (with system libraries)
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Browser test
        working-directory: ui
        run: npm run e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  # --- Cheap gate: fast suite, fakes only, NO Docker (the required gate) ----
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (frozen)
        run: uv sync --frozen --extra dev
      - name: Fast suite ($0, no infra, no model, no LLM provider)
        run: uv run pytest -m "not contract and not model and not llm and not benchmark" -q

  # --- Model gate: tests that load a real spaCy model + embedder (no Docker) -
  # Separate from the required fast gate: installs the small spaCy model AND the
  # `embed` extra (sentence-transformers), then runs the `model`-marked suite
  # (real SpacyNerStage + model-availability smoke test + the bge embedder test,
  # TESTING §5), and the four-document replay (GRA-168), which needs en_core_web_trf:
  # the coref prompt embeds the NER mentions, so the recording only replays under trf.
  # The trf wheel (~400 MB) is cached, keyed on its pinned version.
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (frozen, with the embed and trf extras)
        run: uv sync --frozen --extra dev --extra embed --extra trf
      - name: Download spaCy model (en_core_web_sm)
        run: uv run python -m spacy download en_core_web_sm
      - name: Cache the trf model wheel
        uses: actions/cache@v5
        with:
          path: ~/.cache/spacy-models
          key: spacy-model-en_core_web_trf-3.8.0
      - name: Install spaCy model (en_core_web_trf 3.8.0, pinned)
        env:
          WHEEL: en_core_web_trf-3.8.0-py3-none-any.whl
        run: |
          mkdir -p ~/.cache/spacy-models
          if [ ! -f ~/.cache/spacy-models/$WHEEL ]; then
            curl -fsSL --retry 3 -o ~/.cache/spacy-models/$WHEEL \
              https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/$WHEEL
          fi
          uv pip install ~/.cache/spacy-models/$WHEEL
      - name: Model-backed suite (spaCy NER + bge embedder)
        env:
          HF_HUB_DISABLE_XET: "1"  # route around the HF xet endpoint so bge downloads reliably
        run: uv run pytest -m model -q -rs

  # --- Opt-in gate: real-provider LLM suite (NOT required; no secret) -------
  # Runs the `llm`-marked suite. It is deliberately NOT a required gate: with no
  # API key in the environment the tests skip cleanly (never fail), so this job
  # stays green without any secret. Add a provider key as a repo secret + export
  # it here only if you want the real-provider integration actually exercised.
  llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (frozen)
        run: uv sync --frozen --extra dev
      - name: Real-provider LLM suite (skips cleanly without a key)
        run: uv run pytest -m llm -q

  # --- Opt-in gate: whole-pipeline benchmark smoke (NOT required) -----------
  # Runs the `benchmark`-marked V8 real-stack run (TESTING §5 gap #5). Like the
  # llm job it is deliberately NOT required: without the Docker services / models
  # / API key the single test skips cleanly, so this job stays green without any
  # infra. Wire the services + a provider key here to actually exercise it.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (frozen)
        run: uv sync --frozen --extra dev
      - name: Benchmark smoke (skips cleanly without infra/models/key)
        run: uv run pytest -m benchmark -q

  # --- Security: secret scan (blocking) — dev-playbook #12 ------------------
  # Scans the full git history + working tree for committed secrets. Fails the
  # build on any finding (a leaked credential must never reach main). Runs the
  # pinned gitleaks binary directly so it needs no marketplace action / license.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so gitleaks can scan every commit
      - name: Run gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --verbose --exit-code 1

  # --- Security: dependency vulnerability scan (advisory) — dev-playbook #13 -
  # Audits the locked runtime dependencies against the OSV/PyPI advisory DB.
  # Advisory (continue-on-error): a transitive CVE surfaces in the logs / summary
  # without hard-blocking a demo merge; promote to blocking once triaged.
  dep-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Export locked runtime deps
        run: uv export --frozen --no-emit-project --format requirements-txt > /tmp/requirements.txt
      - name: pip-audit
        run: uvx pip-audit -r /tmp/requirements.txt --strict

  # --- Expensive gate: contract suite via testcontainers (Docker runner) ----
  # Separate from the required fast gate (dev-playbook: layer by cost, gate by
  # layer). ubuntu-latest ships a Docker daemon, so testcontainers self-provisions
  # MinIO/Valkey/Kafka/ES; no manual service containers needed.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (frozen)
        run: uv sync --frozen --extra dev
      - name: Contract suite (real adapters via testcontainers)
        run: uv run pytest -m contract -q

  # --- Image gate: the Dockerfile builds, and what it built starts to import ---
  # `make up` builds this image, so without this job a broken Dockerfile (a workspace member
  # whose manifest is no longer copied, a dependency that no longer resolves) would only show
  # up there. Plain docker CLI, no marketplace action; nothing is pushed. The smoke step runs
  # inside the image: the package and its adapters import, and the spaCy model is installed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (no push)
        run: docker build --tag graph-rag:ci .
      - name: Smoke test inside the image
        run: >
          docker run --rm --entrypoint uv graph-rag:ci run --no-sync python -c
          "import graph_rag.main, spacy; spacy.load('en_core_web_sm'); print('image ok')"
      - name: The image carries the web UI build (the app is not started)
        run: docker run --rm --entrypoint ls graph-rag:ci /app/ui-dist/index.html
