[project]
name = "kggen"
version = "0.1.0"
description = "Standalone seeded generator of synthetic knowledge graphs, documents and questions."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2", "pyyaml"]

[project.optional-dependencies]
# The UI is optional: the generator itself needs only pydantic and pyyaml.
ui = ["indah>=0.12"]

[project.scripts]
kggen = "kggen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kggen", "kggen_ui"]
