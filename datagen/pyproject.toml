[project]
name = "kggen"
version = "0.1.0"
description = "Standalone seeded generator of synthetic knowledge graphs, documents and questions."
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml"]

[project.scripts]
kggen = "kggen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kggen"]
