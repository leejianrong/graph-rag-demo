# Metrics, a dashboard and traces for the local stack (GRA-56). Off unless you ask for it:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up
#
# Grafana http://localhost:3000 (anonymous viewer; the "Graph RAG" dashboard), Prometheus
# http://localhost:9090, Jaeger http://localhost:16686. For local use: nothing here is hardened.
services:
  app:
    environment:
      METRICS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LOG_FORMAT: json
  worker:
    environment:
      METRICS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LOG_FORMAT: json
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [app]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
