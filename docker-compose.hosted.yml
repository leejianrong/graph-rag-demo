# The stack for a hosted deployment (GRA-138, docs/THREAT-MODEL.md). Unlike docker-compose.yml, which is
# the open local loop:
#
#   * no store publishes a port to the host; Elasticsearch, MinIO, Valkey and Neo4j sit on an
#     internal network that only `app` also joins, so they cannot be reached from outside;
#   * every credential is required: compose stops with a message if one is unset, and `app`
#     refuses to start with auth on if one is still a local-dev default (minioadmin, devpassword);
#   * Elasticsearch has security on, and `app` signs in;
#   * REQUIRE_AUTH is on and ALLOW_OPEN_BIND is not set, so the API needs a key.
#
# Put the values in a .env that is not committed:
#   ELASTICSEARCH_PASSWORD=...  MINIO_ACCESS_KEY=...  MINIO_SECRET_KEY=...  NEO4J_PASSWORD=...
#   VALKEY_PASSWORD=...  OPENAI_API_KEY=...
# then:
#   docker compose -f docker-compose.hosted.yml up -d --build --wait
#   docker compose -f docker-compose.hosted.yml exec app uv run --no-sync graph-rag-keys create acme
#
# The API publishes on 127.0.0.1:8000 by default: put a TLS-terminating reverse proxy in front of it
# (API_BIND=0.0.0.0 only if something else already guards the port). Valkey carries the ingest
# triggers and needs VALKEY_PASSWORD; it is also reachable only from `app` and its `worker`s.
# Kafka is the alternative backend (`--profile kafka` with TRIGGER_BACKEND=kafka): it has no
# authentication of its own, so that is acceptable only because those are the only clients on
# its network (THREAT-MODEL.md, section 2). Do not point another client at it. VALKEY_PASSWORD is
# still required, since the Valkey service is in the default set.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # Basic auth over plain HTTP, on a network only `app` is on. TLS between them is not set up.
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [backend]
    healthcheck:
      # An Authorization header rather than curl -u user:password, which secret scanners flag.
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: Basic $$(printf 'elastic:%s' \"$$ELASTIC_PASSWORD\" | base64 -w0)\" http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/localhost/9000
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r line <&3
          [[ $$line == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  valkey:
    image: valkey/valkey:8.1.10
    # The password is read from the environment inside the container, so it is in no file here.
    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$VALKEY_PASSWORD"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}    # valkey-cli reads it: no password on a command line
    volumes:
      - valkey-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Only with `--profile kafka` (and TRIGGER_BACKEND=kafka).
  kafka:
    image: apache/kafka:3.7.0
    profiles: [kafka]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # One ingest worker per partition (GRA-31); the topic is created with this many.
      KAFKA_NUM_PARTITIONS: ${INGEST_PARTITIONS:-4}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  app:
    image: graph-rag-demo:hosted    # the worker below runs this same image
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment: &pipeline-env
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      ELASTICSEARCH_URL: http://elasticsearch:9200
      TRIGGER_BACKEND: ${TRIGGER_BACKEND:-redis}
      REDIS_URL: redis://valkey:6379/0
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      REQUIRE_AUTH: "true"
      API_KEYS_PATH: /keys/api-keys.json
      ALLOW_OPEN_BIND: "false"
      # The API only publishes; the `worker` service consumes (GRA-31). Job status then lives in
      # Elasticsearch, where both can reach it.
      INGEST_MODE: publish
      # Files the API and the workers both use live on one shared volume (GRA-31): usage counts
      # (METER_USAGE, GRA-58) and tenants' LLM keys (REQUIRE_TENANT_LLM_KEY, GRA-25).
      USAGE_PATH: /state/usage.json
      TENANT_LLM_KEYS_PATH: /state/tenant-llm-keys.json
    volumes:
      - api-keys:/keys
      - shared-state:/state
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    networks: [backend, public]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # Not started unless the `kafka` profile is on; required: false lets compose skip it then.
      kafka:
        condition: service_healthy
        required: false
      neo4j:
        condition: service_healthy

  # Ingest workers: same image, no published port. Scale with
  #   docker compose -f docker-compose.hosted.yml up -d --scale worker=3
  # Workers need the store credentials and the LLM provider (hence `public` for egress). The
  # usage file and tenants' LLM keys sit on the `shared-state` volume both services mount.
  worker:
    image: graph-rag-demo:hosted
    command: ["uv", "run", "--no-sync", "python", "-m", "graph_rag.worker"]
    env_file:
      - path: .env
        required: false
    environment: *pipeline-env
    volumes:
      - shared-state:/state
    networks: [backend, public]
    stop_grace_period: 120s    # SIGTERM finishes the document in hand before exiting
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      app:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
      neo4j:
        condition: service_healthy

networks:
  # The stores: an internal network has no route to the host's network or the internet.
  backend:
    internal: true
  # `app` alone, for the published API port and calls out to the LLM provider.
  public: {}

volumes:
  es-data:
  minio-data:
  neo4j-data:
  valkey-data:
  api-keys:
  shared-state:
